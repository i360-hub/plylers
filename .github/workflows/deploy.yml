# Push-to-deploy: build the Astro site and deploy to the existing Cloudflare
# Pages project (named `plylers-tree-service-staging` for legacy reasons — it
# serves production), then smoke-check the launch checklist.
# Requires repo secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name plylers-tree-service-staging

      - name: Smoke-check launch checklist
        run: |
          sleep 10

          echo "1/4 staging must serve 200 with noindex..."
          curl -s -D - -o /dev/null "https://plylers-tree-service-staging.pages.dev/" | tee /tmp/h
          grep -i "x-robots-tag: noindex" /tmp/h

          echo "2/4 production must serve 200..."
          curl -sf -o /tmp/page.html "https://www.plylerstreeservice.com/?cb=$(date +%s)"

          echo "3/4 production must NOT be noindexed..."
          ! curl -s -D - -o /dev/null "https://www.plylerstreeservice.com/?cb=$(date +%s)" | grep -qi "x-robots-tag"

          echo "4/4 canonical must point at production domain..."
          grep -q 'https://www.plylerstreeservice.com' /tmp/page.html

          echo "All checks passed."

      # Ping IndexNow with the just-built sitemap URLs so Bing/Yandex/etc. recrawl
      # promptly. Key is public (served at /<key>.txt), so no secret needed. This
      # is a best-effort notification — a failure here must not fail the deploy.
      - name: Notify IndexNow
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, urllib.error
          key  = "8ba9a1fc7d8ef3a760dd58d24bbebbf2"
          host = "www.plylerstreeservice.com"
          urls = re.findall(r"<loc>(.*?)</loc>", open("dist/sitemap-0.xml", encoding="utf-8").read())
          if not urls:
              raise SystemExit("No URLs found in dist/sitemap-0.xml")
          body = {
              "host": host,
              "key": key,
              "keyLocation": f"https://{host}/{key}.txt",
              "urlList": urls,
          }
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=json.dumps(body).encode("utf-8"),
              headers={"Content-Type": "application/json; charset=utf-8"},
          )
          try:
              r = urllib.request.urlopen(req, timeout=30)
              print(f"IndexNow accepted (HTTP {r.status}) — submitted {len(urls)} URLs")
          except urllib.error.HTTPError as e:
              print(f"IndexNow HTTP {e.code}: {e.read().decode(errors='replace')}")
              raise
          PY
